<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#6b7380;--ac:#e8590c;--ok:#2f9e44;--ln:#e3e6ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#1a1f27;--tx:#eef1f5;--mut:#98a1ae;--ac:#ff8a4c;--ok:#51cf66;--ln:#2a313c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#1a1f27;--tx:#eef1f5;--mut:#98a1ae;--ac:#ff8a4c;--ok:#51cf66;--ln:#2a313c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 12px 150px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav button,.tabs button,.mini{border:0;background:var(--card);color:var(--tx);border-radius:12px;font-size:20px;padding:10px 16px;box-shadow:0 0 0 1px var(--ln)}
.ttl{text-align:center;flex:1}.ttl b{font-size:20px;display:block}.ttl span{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 0 0 1px var(--ln)}
.card h3{margin:0 0 2px;font-size:17px}.plan{color:var(--mut);font-size:14px}.tag{color:var(--ac);font-size:13px;font-weight:600}
.sets{display:flex;gap:10px;margin:12px 0 10px;flex-wrap:wrap}
.set{width:52px;height:52px;border-radius:50%;border:2px solid var(--ac);background:none;color:var(--ac);font-size:18px;font-weight:700}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.row input{flex:1;min-width:0;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.prog{height:6px;background:var(--ln);border-radius:3px;margin-bottom:12px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}
.tabs button{flex:1;font-size:15px;padding:12px 4px}.tabs button.a{background:var(--ac);color:#fff}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:6px;border-radius:12px;background:var(--card);box-shadow:0 0 0 1px var(--ln);font-size:15px}
.li small{color:var(--mut)}.li.done{background:rgba(47,158,68,.25);box-shadow:0 0 0 1px #2f9e44}.li.cur{box-shadow:0 0 0 2px var(--ac)}.wk{margin:14px 4px 6px;color:var(--mut);font-size:13px;font-weight:600}
#tm{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border-radius:16px;display:none;align-items:center;justify-content:space-between;padding:10px 14px;max-width:536px;margin:0 auto}
#tm b{font-size:28px;font-variant-numeric:tabular-nums}#tm button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 12px;font-size:16px;margin-left:6px}
.btn{width:100%;border:0;background:var(--ac);color:#fff;font-size:16px;border-radius:12px;padding:14px;margin-top:8px}
textarea{width:100%;height:120px;margin-top:8px;font-size:12px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px}
.note{color:var(--mut);font-size:13px;line-height:1.4;margin:6px 4px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mini.sm{font-size:13px;padding:6px 10px;white-space:nowrap;color:var(--mut)}
.card.sk{background:var(--ln)}.card.sk h3{text-decoration:line-through;opacity:.6;margin:0}
.btn.big{padding:22px;font-size:20px;margin-top:12px}
.row2{display:flex;gap:10px}.row2 label{flex:1;font-size:13px;color:var(--mut)}
.row2 input{display:block;width:100%;margin-top:4px;font-size:22px;text-align:center;padding:10px;border-radius:10px;border:2px solid var(--ln);background:var(--bg);color:var(--tx)}
.row2 input.gt{border-color:#2f9e44;background:rgba(47,158,68,.28)}
.row2 input.lt{border-color:#e03131;background:rgba(224,49,49,.25)}
</style>
</head>
