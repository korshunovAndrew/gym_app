<title>Тренировки</title>

<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#6b7380;--ac:#e8590c;--ok:#2f9e44;--ln:#e3e6ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#1a1f27;--tx:#eef1f5;--mut:#98a1ae;--ac:#ff8a4c;--ok:#51cf66;--ln:#2a313c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#1a1f27;--tx:#eef1f5;--mut:#98a1ae;--ac:#ff8a4c;--ok:#51cf66;--ln:#2a313c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 12px 150px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav button,.tabs button,.mini{border:0;background:var(--card);color:var(--tx);border-radius:12px;font-size:20px;padding:10px 16px;box-shadow:0 0 0 1px var(--ln)}
.ttl{text-align:center;flex:1}.ttl b{font-size:20px;display:block}.ttl span{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 0 0 1px var(--ln)}
.card h3{margin:0 0 2px;font-size:17px}.plan{color:var(--mut);font-size:14px}.tag{color:var(--ac);font-size:13px;font-weight:600}
.sets{display:flex;gap:10px;margin:12px 0 10px;flex-wrap:wrap}
.set{width:52px;height:52px;border-radius:50%;border:2px solid var(--ac);background:none;color:var(--ac);font-size:18px;font-weight:700}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.row input{flex:1;min-width:0;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.prog{height:6px;background:var(--ln);border-radius:3px;margin-bottom:12px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}
.tabs button{flex:1;font-size:15px;padding:12px 4px}.tabs button.a{background:var(--ac);color:#fff}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:6px;border-radius:12px;background:var(--card);box-shadow:0 0 0 1px var(--ln);font-size:15px}
.li small{color:var(--mut)}.rt{display:flex;align-items:center;gap:8px;white-space:nowrap}.pl{color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}.lgb{height:8px;border-radius:4px;margin:0 4px 4px;background:linear-gradient(90deg,hsl(120,65%,40%),hsl(60,65%,40%),hsl(0,65%,40%))}.li.done{background:rgba(47,158,68,.25);box-shadow:0 0 0 1px #2f9e44}.li.cur{box-shadow:0 0 0 2px var(--ac)}.wk{margin:14px 4px 6px;color:var(--mut);font-size:13px;font-weight:600}
#tm{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border-radius:16px;display:none;align-items:center;justify-content:space-between;padding:10px 14px;max-width:536px;margin:0 auto}
#tm b{font-size:28px;font-variant-numeric:tabular-nums}#tm button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 12px;font-size:16px;margin-left:6px}
.btn{width:100%;border:0;background:var(--ac);color:#fff;font-size:16px;border-radius:12px;padding:14px;margin-top:8px}
textarea{width:100%;height:120px;margin-top:8px;font-size:12px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px}
.note{color:var(--mut);font-size:13px;line-height:1.4;margin:6px 4px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mini.sm{font-size:13px;padding:6px 10px;white-space:nowrap;color:var(--mut)}
.card.sk{background:var(--ln)}.card.sk h3{text-decoration:line-through;opacity:.6;margin:0}
.btn.big{padding:22px;font-size:20px;margin-top:12px}
.row2{display:flex;gap:10px}.row2 label{flex:1;font-size:13px;color:var(--mut)}
.row2 input{display:block;width:100%;margin-top:4px;font-size:22px;text-align:center;padding:10px;border-radius:10px;border:2px solid var(--ln);background:var(--bg);color:var(--tx)}
.row2 input.gt{border-color:#2f9e44;background:rgba(47,158,68,.28)}
.row2 input.lt{border-color:#e03131;background:rgba(224,49,49,.25)}
</style>
</head>

function mv(d){navd=true;idx=Math.max(0,Math.min(D.length-1,idx+d));render()}
function tap(k,j){var key=D[idx][0]+"|"+k,e=D[idx][2][k],a=S.s[key]||[];while(a.length<e[1])a.push(false);a[j]=!a[j];S.s[key]=a;save();kick(D[idx][0]);render();}
function skp(k){var key=D[idx][0]+"|"+k;if(S.k[key])delete S.k[key];else S.k[key]=1;save();kick(D[idx][0]);render()}
function dg(v){return String(v==null?"":v).replace(/\D/g,"").slice(0,3)}
function pn(s){if(/без доп/.test(s||""))return 0;var m=/\d+(\.\d+)?/.exec(s||"");return m?+m[0]:null}
function cl(v,p){if(v===""||p==null)return "";v=+v;if(isNaN(v))return "";return v>=p?"gt":"lt"}
function dw(v){v=String(v==null?"":v).replace(",",".").replace(/[^\d.]/g,"");var i=v.indexOf(".");if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,"");return v.slice(0,6)}
function fld(el,f,k){var e=D[idx][2][k],key=D[idx][0]+"|"+k,v=f?dg(el.value):dw(el.value);el.value=v;(f?S.r:S.w)[key]=v;el.className=cl(v,f?(/^\d+$/.test(e[2])?+e[2]:null):pn(e[3]));save();kick(D[idx][0])}
function render(){
 for(var i=0;i<3;i++)document.getElementById("b"+i).className=i==tab?"a":"";
 var h="",A=document.getElementById("app");
 if(tab==0){
  var d=D[idx],n=dn(idx),T=tot(idx);
  h+='<div class="nav"><button onclick="mv(-1)">‹</button><div class="ttl"><b>'+d[1]+'</b><span>'+fd(d[0])+' · тренировка '+(idx+1)+' из '+D.length+'</span></div><button onclick="mv(1)">›</button></div>';
  h+='<div class="prog"><i style="width:'+(T?Math.round(n/T*100):100)+'%"></i></div>';
  d[2].forEach(function(e,k){
   var key=d[0]+"|"+k,a=S.s[key]||[],w=dw(S.w[key]),r=dg(S.r[key]),ld=e[3]?" · "+e[3]:"",pw=pn(e[3]),pr=/^\d+$/.test(e[2])?+e[2]:null,sk=false;
   if(S.k[key]){h+='<div class="card sk"><div class="hd"><h3>'+(k+1)+'. '+e[0]+'</h3></div><button class="btn big" onclick="skp('+k+')">Выполнить</button></div>';return}
   h+='<div class="card'+(sk?' sk':'')+'"><div class="hd"><h3>'+(k+1)+'. '+e[0]+'</h3><button class="mini sm" onclick="skp('+k+')">'+(sk?'Выполнить':'Пропустить')+'</button></div><div class="plan">'+e[1]+'×'+e[2]+ld+'</div>'+(e[4]?'<div class="tag">'+e[4]+'</div>':'')+'<div class="sets">';
   for(var j=0;!sk&&j<e[1];j++)h+='<button class="set'+(a[j]?' on':'')+'" onclick="tap('+k+','+j+')">'+(a[j]?'✓':j+1)+'</button>';
   h+='</div><div class="row2"><label>Вес, кг<input class="'+cl(w,pw)+'" inputmode="decimal" maxlength="6" autocomplete="off" placeholder="'+(pw==null?"":pw)+'" value="'+w+'" oninput="fld(this,0,'+k+')"></label><label>Повторы<input class="'+cl(r,pr)+'" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="'+(pr==null?"":pr)+'" value="'+r+'" oninput="fld(this,1,'+k+')"></label></div></div>';
  });
  var fn=!!S.f[d[0]];h+='<button class="btn" style="background:var(--mut)" onclick="startT(180)">⏱ Таймер 3:00</button>';
  h+='<button class="btn" style="'+(fn?'background:var(--ok)':'')+'" onclick="fin()">'+(fn?'✓ Тренировка завершена (нажмите, чтобы отменить)':'Завершить тренировку')+'</button><p class="note" id="st">'+ST+'</p>'+(idx>0&&!allPrev()?'<button class="mini" style="width:100%" onclick="markPrev()">Отметить все предыдущие тренировки выполненными</button>':'');
 }else if(tab==1){
  h+='<div class="note">Цвет и подпись показывают тяжесть тренировки по основному упражнению</div><div class="lgb"></div><div class="note" style="display:flex;justify-content:space-between;margin-top:0"><span>разгрузка</span><span>пик</span></div>';
  var wk=-1;
  D.forEach(function(d,i){var cy=Math.floor(i/4)+1;
   if(cy!=wk){wk=cy;h+='<div class="wk">ЦИКЛ '+cy+'</div>'}
   var n=dn(i),T=tot(i),m=S.f[d[0]]?"✓":(n?n+"/"+T:""),L=lvl(i);
   h+='<div class="li'+(S.f[d[0]]?' done':'')+(i==idx?' cur':'')+'" onclick="idx='+i+';navd=true;go(0)"><span>№'+(i+1)+' · '+fd(d[0])+' · <b>'+d[1]+'</b><br><small>'+d[2][0][0]+' '+d[2][0][1]+'×'+d[2][0][2]+(d[2][0][3]?' ('+d[2][0][3]+')':'')+'</small></span><span class="rt"><span class="pl" style="background:hsl('+L.h+',65%,40%)">'+L.n+'</span><b style="color:var(--ok)">'+m+'</b></span></div>'});
 }else{
  var c=0;
  D.forEach(function(d,i){var n=dn(i);if(!n&&!S.f[d[0]])return;c++;
   var ws=d[2].map(function(e,k){var a=S.w[d[0]+"|"+k],b=S.r[d[0]+"|"+k];return (a||b)?e[0]+": "+(a||"–")+" кг × "+(b||"–"):""}).filter(Boolean).join("; ");
   h+='<div class="li"><span>'+fd(d[0])+' · <b>'+d[1]+'</b><br><small>'+(ws||"без заметок")+'</small></span><b>'+(S.f[d[0]]?"✓ ":"")+n+'/'+tot(i)+'</b></div>'});
  if(!c)h+='<p class="note">Пока пусто. Отмечайте подходы на вкладке «Тренировка».</p>';
  h+='<button class="btn" onclick="sv()">Сохранить таблицу (CSV)</button><button class="btn" style="background:var(--mut)" onclick="exp()">Скопировать текстом</button><button class="btn" onclick="bk()">Резервная копия (JSON)</button><button class="btn" style="background:var(--mut)" onclick="document.getElementById(\'rf\').click()">Восстановить из копии</button><input type="file" id="rf" accept=".json,application/json" style="display:none" onchange="rs(this)"><textarea id="pt" placeholder="Или вставьте сюда текст копии" style="height:70px"></textarea><button class="btn" style="background:var(--mut)" onclick="rt()">Восстановить из текста</button><p class="note" id="svs"></p><textarea id="ta" style="display:none" readonly></textarea><p class="note">Данные хранятся только на этом телефоне. Раз в неделю сохраняйте резервную копию: в окне выберите «Сохранить в Файлы» или Google Диск / Яндекс Диск.</p>';
 }
 A.innerHTML=h;
}
function csv(){
 var L=["дата,день,упражнение,план,выполнено подходов,всего подходов,вес,повторы"];
 D.forEach(function(d,i){if(!dn(i)&&!S.f[d[0]])return;d[2].forEach(function(e,k){var key=d[0]+"|"+k,a=(S.s[key]||[]).filter(Boolean).length,w=dw(S.w[key]),rr=dg(S.r[key]);if(S.k[key]){a=0;w="пропущено";rr=""}
  L.push([d[0],d[1],e[0],e[1]+"×"+e[2]+(e[3]?" ("+e[3]+")":""),a,e[1],w,rr].join(","))})});
 return L.join("\n")
}
function exp(){
 var t=csv(),ta=document.getElementById("ta");ta.style.display="block";ta.value=t;ta.select();
 try{navigator.clipboard.writeText(t)}catch(e){}
}
var endAt=0,AU=null,KA=null,BG=false;try{BG=localStorage.getItem("wtbg")=="1"}catch(e){}
function actx(){try{if(!AU)AU=new(window.AudioContext||window.webkitAudioContext)();if(AU.state=="suspended")AU.resume()}catch(e){}return AU}
function wav(){var n=8000,b=new Uint8Array(44+n),v=new DataView(b.buffer),i;function s(o,t){for(var k=0;k<t.length;k++)v.setUint8(o+k,t.charCodeAt(k))}
 s(0,"RIFF");v.setUint32(4,36+n,true);s(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);s(36,"data");v.setUint32(40,n,true);for(i=0;i<n;i++)b[44+i]=128;return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
function keep(on){try{if(on&&BG){if(!KA){KA=new Audio(wav());KA.loop=true}KA.play().catch(function(){})}else if(KA)KA.pause()}catch(e){}}
function bgUi(){var e=document.getElementById("bg");if(e)e.textContent=BG?"\uD83D\uDD14":"\uD83D\uDD15"}
function tbg(){BG=!BG;try{localStorage.setItem("wtbg",BG?"1":"0")}catch(e){}bgUi();if(endAt)keep(1)}
function fmt(s){return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function rem(){return Math.ceil((endAt-Date.now())/1000)}
function startT(s){actx();endAt=Date.now()+s*1000;document.getElementById("tm").style.display="flex";bgUi();clearInterval(iv);tick();iv=setInterval(tick,500);keep(1)}
function tick(){if(!endAt)return;var r=rem();if(r<=0){var late=Date.now()-endAt;stopT();if(late<20000)beep();return}document.getElementById("tt").textContent=fmt(r)}
function adj(x){if(!endAt)return;endAt=Date.now()+Math.max(5,rem()+x)*1000;tick()}
function stopT(){clearInterval(iv);endAt=0;keep(0);document.getElementById("tm").style.display="none"}
function beep(){try{var c=actx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type="sine";o.frequency.value=660;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.5)}catch(e){}try{if(navigator.vibrate)navigator.vibrate(300)}catch(e){}}
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
var ST="Данные сохраняются на этом телефоне";
function setST(t){ST=t;var e=document.getElementById("st");if(e)e.textContent=t}
function kick(){}
function fin(){var iso=D[idx][0];if(S.f[iso]){delete S.f[iso];ST="Завершение отменено"}else{S.f[iso]=Date.now();stopT();ST="✓ Тренировка сохранена на этом телефоне"}save();render()}
async function sf(nm,txt,ty){
 var m=document.getElementById("svs");
 try{var f=new File([txt],nm,{type:ty});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nm});m.textContent="✓ Готово. В окне выберите «Сохранить в Файлы» или приложение Google Диск / Яндекс Диск";return}
  var a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=nm;document.body.appendChild(a);a.click();a.remove();m.textContent="✓ Файл скачан: "+nm
 }catch(e){m.textContent=(e&&e.name=="AbortError")?"Сохранение отменено":"Не удалось сохранить файл. Используйте «Скопировать текстом»"}}
function dstr(){var n=new Date();return n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2)}
function sv(){sf("trenirovki_"+dstr()+".csv","\uFEFF"+csv(),"text/csv")}
function bk(){sf("trenirovki-backup_"+dstr()+".json",JSON.stringify({v:2,S:S}),"application/json")}
function ld(t){var m=document.getElementById("svs");try{var o=JSON.parse(t),x=o&&o.S;if(!x||!x.s||!x.f||!x.w)throw 0;S.s=x.s;S.w=x.w;S.r=x.r||{};S.f=x.f;S.k=x.k||{};save();pick();render();m=document.getElementById("svs");if(m)m.textContent="✓ Данные восстановлены. Завершённых тренировок: "+Object.keys(S.f).length}catch(e){if(m)m.textContent="Это не похоже на копию данных"}}
function rs(el){var f=el.files&&el.files[0];if(!f)return;f.text().then(ld);el.value=""}
function rt(){ld(document.getElementById("pt").value)}
function allPrev(){for(var i=0;i<idx;i++)if(!S.f[D[i][0]])return false;return true}
function markPrev(){if(!confirm("Отметить все тренировки до №"+(idx+1)+" выполненными? Подходы и веса в них останутся пустыми."))return;for(var i=0;i<idx;i++)if(!S.f[D[i][0]])S.f[D[i][0]]=Date.now();save();render()}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
render();
</script>
</body>
